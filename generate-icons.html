<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Icon Generator — SG Tracker</title>
<style>
  body { font-family: sans-serif; background: #1a1a2e; color: #fff; padding: 40px; text-align: center; }
  h2 { color: #c9a84c; margin-bottom: 20px; }
  canvas { border: 2px solid #c9a84c; border-radius: 12px; margin: 10px; display: none; }
  .btn { display: inline-block; margin: 10px; padding: 14px 28px; background: #c9a84c; color: #0a0f1e;
         font-weight: 700; font-size: 16px; border-radius: 8px; text-decoration: none; cursor: pointer; }
  p { color: #8fa4c8; margin-top: 20px; line-height: 1.6; }
</style>
</head>
<body>
<h2>SG Tracker — Icon Generator</h2>
<p>Click the buttons below to download both icon files.<br>
Then upload them to your Netlify site alongside the other files.</p>

<canvas id="c192" width="192" height="192"></canvas>
<canvas id="c512" width="512" height="512"></canvas>

<br>
<a id="dl192" class="btn" download="icon-192.png">⬇ Download icon-192.png</a>
<a id="dl512" class="btn" download="icon-512.png">⬇ Download icon-512.png</a>

<p id="status" style="color:#22c55e; font-weight:600;"></p>

<script>
function drawIcon(canvas) {
  const s = canvas.width;
  const ctx = canvas.getContext('2d');

  // Rounded rect background
  ctx.fillStyle = '#0a0f1e';
  ctx.beginPath();
  ctx.roundRect(0, 0, s, s, s * 0.18);
  ctx.fill();

  // Gold border ring
  ctx.strokeStyle = '#c9a84c';
  ctx.lineWidth = s * 0.045;
  ctx.beginPath();
  ctx.roundRect(s * 0.06, s * 0.06, s * 0.88, s * 0.88, s * 0.13);
  ctx.stroke();

  // "SG" letters
  ctx.fillStyle = '#c9a84c';
  ctx.font = `900 ${Math.round(s * 0.44)}px Georgia, serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText('SG', s / 2, s * 0.58);

  // Gold underline
  ctx.strokeStyle = '#c9a84c';
  ctx.lineWidth = s * 0.038;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(s * 0.26, s * 0.70);
  ctx.lineTo(s * 0.74, s * 0.70);
  ctx.stroke();

  // Subtitle
  ctx.fillStyle = '#8fa4c8';
  ctx.font = `600 ${Math.round(s * 0.085)}px Arial, sans-serif`;
  ctx.textBaseline = 'middle';
  ctx.fillText('TRACKER', s / 2, s * 0.84);
}

window.addEventListener('load', () => {
  const c192 = document.getElementById('c192');
  const c512 = document.getElementById('c512');

  drawIcon(c192);
  drawIcon(c512);

  document.getElementById('dl192').href = c192.toDataURL('image/png');
  document.getElementById('dl512').href = c512.toDataURL('image/png');

  document.getElementById('status').textContent = 'Icons ready — click to download!';
});
</script>
</body>
</html>
